<!doctype html>
<!-- UIA animated reel template (1080x1920). Render with scripts/render_frames.js; tokens {{BRAND}}, {{LOGO_STACKED}},
     {{LOGO_H}}, {{SYMBOL}} are filled in by the renderer. Edit SCENES (HTML below) + CUTS + the per-scene block in setT(t).
     Demo content: a 3-scene, 8-second sample (hook → offer → CTA) so the template renders as-is. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'A';font-weight:400;src:url('file://{{BRAND}}/Fonts/static/Archivo-Regular.ttf')}
@font-face{font-family:'A';font-weight:600;src:url('file://{{BRAND}}/Fonts/static/Archivo-SemiBold.ttf')}
@font-face{font-family:'AW';font-weight:600;src:url('file://{{BRAND}}/Fonts/static/Archivo-SemiBoldExpanded.ttf')}
@font-face{font-family:'N';font-style:normal;src:url('file://{{BRAND}}/Fonts/Newsreader-normal-400-latin.woff2')}
@font-face{font-family:'N';font-style:italic;src:url('file://{{BRAND}}/Fonts/Newsreader-italic-400-latin.woff2')}
@font-face{font-family:'AR';font-weight:600;src:url('file://{{BRAND}}/Fonts/IBMPlexSansArabic-normal-600-arabic.woff2')}
@font-face{font-family:'AR';font-weight:700;src:url('file://{{BRAND}}/Fonts/IBMPlexSansArabic-normal-700-arabic.woff2')}
:root{--midnight:#0B1626;--blue:#29566C;--gold:#E2A02D;--platinum:#D8DADF;--paper:#F5F4F0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--midnight);color:#fff;font-family:'A',sans-serif}
#cam{position:absolute;inset:0}
.bg{position:absolute;inset:-200px;background:radial-gradient(60% 40% at 50% 45%,#1c3b52 0%,var(--midnight) 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(216,218,223,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(216,218,223,.05) 2px,transparent 2px);background-size:90px 90px}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;padding:250px 90px 340px} /* IG safe zone */
.ar{font-family:'AR','A';direction:rtl}             /* Latin inside Arabic falls back to Archivo, not Times */
.en{font-family:'N',serif}
.lbl{font-family:'AW';font-weight:600;letter-spacing:.2em;font-size:30px;color:var(--platinum)}
.tile{width:620px;height:200px;border-radius:36px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'AW';font-weight:600;font-size:110px;letter-spacing:.06em;margin:16px 0}
.tile.g{background:var(--gold);color:var(--midnight)}
.chip{display:inline-block;border:3px solid rgba(216,218,223,.5);border-radius:999px;padding:14px 30px;font-size:38px;font-weight:600;margin:10px;white-space:nowrap}
.wipe{position:absolute;top:-400px;bottom:-400px;width:260px;background:var(--gold);transform:skewX(-14deg);left:-900px}
.line{position:absolute;top:-400px;bottom:-400px;width:10px;background:var(--gold);transform:skewX(-14deg);left:-900px}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><div id="cam"><div class="bg"></div><div class="grid" id="grid"></div>

<!-- SCENE 0: hook -->
<div class="sc" id="s0">
  <div class="ar" id="h1" style="font-weight:700;font-size:130px;line-height:1.2">جامعة أحلامك</div>
  <div class="ar" id="h2" style="font-weight:700;font-size:96px;color:var(--gold);margin-top:10px">بتبدأ من علامتك</div>
  <div class="en" id="h3" style="font-size:50px;font-style:italic;color:var(--platinum);margin-top:60px">Your dream university starts with your score.</div>
</div>
<!-- SCENE 1: offer tiles -->
<div class="sc" id="s1">
  <div class="lbl" style="margin-bottom:40px">ONE ACADEMY · <span dir="rtl" style="unicode-bidi:isolate;font-family:'AR','A'">كلها بمكان واحد</span></div>
  <div class="tile" id="t0">AP</div><div class="tile" id="t1">SAT</div><div class="tile g" id="t2">EST II</div>
</div>
<!-- SCENE 2: logo + CTA -->
<div class="sc" id="s2">
  <div id="logo" style="width:560px">{{LOGO_STACKED}}</div>
  <div class="ar" id="c1" style="font-weight:700;font-size:110px;margin-top:60px">سجّل الآن</div>
  <div id="c3" style="margin-top:40px;border:4px solid var(--gold);border-radius:40px;padding:30px 50px">
    <div class="lbl">CALL OR WHATSAPP</div><div style="font-weight:600;font-size:84px;margin-top:10px">+962 79 055 5890</div></div>
</div>
</div>
<div class="line" id="l1"></div><div class="wipe" id="w"></div><div class="line" id="l2"></div><div class="flash" id="fl"></div>
<script>
const CUTS=[0,2.6,5.0];          // scene start times (s); put cuts on the VO pauses
const HITS=[2.75,3.25,3.75,5.05]; // impact times: camera shake (match the 'impact' cues in cues.json)
const FLASH=[5.05];               // white flash on the biggest hit (logo)
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const bk=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(el,t,a,dur=.35,from=1.6)=>{const k=cl((t-a)/dur);el.style.opacity=k>0?1:0;el.style.transform='scale('+(from+(1-from)*bk(k))+')';};
const rise=(el,t,a,dur=.4,dy=60)=>{const k=eo((t-a)/dur);el.style.opacity=k;el.style.transform='translateY('+((1-k)*dy)+'px)';};
window.setT=(t)=>{
  let si=0;for(let i=0;i<CUTS.length;i++) if(t>=CUTS[i]) si=i;
  document.querySelectorAll('.sc').forEach((s,i)=>s.style.opacity=i===si?1:0);
  // gold line wipe centred on each cut (0.45 s)
  let wk=-1;for(let i=1;i<CUTS.length;i++){const d=t-(CUTS[i]-.22);if(d>=0&&d<.45)wk=d/.45;}
  const X=wk<0?-900:-700+wk*2500;$('w').style.left=X+'px';$('l1').style.left=(X-120)+'px';$('l2').style.left=(X+380)+'px';
  // camera push + shake on hits; grid drift; flash
  let shake=0;for(const s of HITS){const d=t-s;if(d>=0&&d<.25)shake=Math.max(shake,(1-d/.25)*14);}
  $('cam').style.transform='scale('+(1+(t-CUTS[si])*.012)+') translate('+(Math.sin(t*90)*shake)+'px,'+(Math.cos(t*77)*shake)+'px)';
  $('grid').style.transform='translateY('+(-t*40%90)+'px)';
  let f=0;for(const s of FLASH){const d=t-s;if(d>=0&&d<.3)f=Math.max(f,(1-d/.3)*.55);}$('fl').style.opacity=f;
  // ---- per-scene timeline ----
  pop($('h1'),t,.05,.3,1.8);$('h1').style.textShadow=(t>.05&&t<.22)?'8px 0 #E2A02D,-8px 0 #29566C':'none'; // glitch
  pop($('h2'),t,.9,.3,1.8);rise($('h3'),t,1.4,.5);
  pop($('t0'),t,2.75,.3,2.2);pop($('t1'),t,3.25,.3,2.2);pop($('t2'),t,3.75,.3,2.2);
  pop($('logo'),t,5.05,.5,.6);pop($('c1'),t,5.9,.3,1.9);pop($('c3'),t,6.4,.35,1.3);
};
setT(0);
</script></body></html>
