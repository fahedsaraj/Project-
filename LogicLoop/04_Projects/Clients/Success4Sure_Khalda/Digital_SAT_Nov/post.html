<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digital SAT — November Test Prep — 1080x1350</title>
<style>
  @font-face { font-family: IT; font-weight: 500; src: url(fonts/InterTight-500.ttf); }
  @font-face { font-family: IT; font-weight: 700; src: url(fonts/InterTight-700.ttf); }
  @font-face { font-family: IT; font-weight: 800; src: url(fonts/InterTight-800.ttf); }
  @font-face { font-family: IS; font-style: italic; src: url(fonts/InstrumentSerif-i.ttf); }
  @font-face { font-family: Playfair; font-weight: 900; src: url(fonts/Playfair-900.ttf); }

  /* Same system as the approved EST II V2 post */
  :root { --brand: #8B0214; --lit: #E23A4E; --night: #120204; --cream: #F6EEE2;
    --muted: rgba(246,238,226,.62); --hair: rgba(246,238,226,.16); --m: 96px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--night); }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: var(--night); color: var(--cream); font-family: IT, sans-serif; }

  .key  { position: absolute; width: 1300px; height: 1300px; right: -560px; top: -600px; border-radius: 50%;
          background: radial-gradient(circle, rgba(200,16,46,.85) 0%, rgba(139,2,20,.55) 30%, rgba(139,2,20,0) 65%); }
  .fill { position: absolute; width: 1100px; height: 900px; left: -520px; bottom: -520px; border-radius: 50%;
          background: radial-gradient(circle, rgba(139,2,20,.45), rgba(139,2,20,0) 65%); }
  .grain { position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay; }

  .head { position: absolute; top: 80px; left: var(--m); right: var(--m);
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 24px; border-bottom: 1px solid var(--hair); }
  .logo { line-height: 1; }
  .logo .w1 { font-family: Playfair; font-weight: 900; font-size: 34px; letter-spacing: .04em; display: block; }
  .logo .w2 { font-weight: 700; font-size: 14px; letter-spacing: .6em; margin-top: 7px; display: block; color: var(--muted); }
  .head .k { font-weight: 500; font-size: 17px; letter-spacing: .32em; color: var(--muted); }

  .title { position: absolute; top: 196px; left: var(--m); right: var(--m); }
  .h1 { font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -.05em; margin-left: -8px; padding: 0 24px 6px 0; display: inline-block;
    background: linear-gradient(180deg, #FFFaF2 10%, #E6D6C0 95%); -webkit-background-clip: text; color: transparent;
    filter: drop-shadow(0 24px 40px rgba(0,0,0,.5)); }
  .h1 span { padding-right: .08em; margin-right: -.08em; background: linear-gradient(180deg, #FF6A78 0%, var(--lit) 35%, var(--brand) 100%);
    -webkit-background-clip: text; color: transparent; }
  .h2 { font-family: IS; font-style: italic; font-size: 76px; line-height: 1; margin-top: -6px; }

  /* Key dates */
  .dates { position: absolute; top: 470px; left: var(--m); right: var(--m); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chip { display: flex; flex-direction: column; gap: 8px; padding: 20px 28px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    border: 1px solid rgba(246,238,226,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .chip .l { font-weight: 700; font-size: 16px; letter-spacing: .3em; color: var(--lit); }
  .chip .v { font-weight: 800; font-size: 46px; letter-spacing: -.01em; line-height: 1; }
  .chip.main { background: var(--cream); color: var(--brand); border-color: transparent;
    box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .chip.main .l { color: rgba(139,2,20,.7); }

  /* Teacher cards */
  .teachers { position: absolute; top: 638px; left: var(--m); right: var(--m); height: 520px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { position: relative; overflow: hidden; border-radius: 26px;
    background: radial-gradient(ellipse 90% 70% at 50% 30%, #6E0A18 0%, #3A050C 60%, #1E0306 100%);
    border: 1px solid rgba(246,238,226,.12); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .card img { position: absolute; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 190px;
    background: linear-gradient(180deg, transparent, rgba(18,2,4,.92) 70%); }
  .card .name { position: absolute; left: 26px; right: 20px; bottom: 24px; }
  .card .subj { display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: .3em;
    color: var(--night); background: var(--cream); padding: 7px 12px 6px; border-radius: 6px; }
  .card .n { font-weight: 700; font-size: 29px; letter-spacing: -.01em; margin-top: 12px; line-height: 1.1; }
  /* matched head sizes */
  .sara img   { width: 640px; left: -110px; top: -86px; }
  .naseem img { width: 452px; left: -16px;  top: -18px; }

  /* Action */
  .act { position: absolute; left: var(--m); right: var(--m); bottom: 56px; height: 104px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 44px;
    background: linear-gradient(180deg, #A0051B, var(--brand)); border-radius: 100px;
    box-shadow: 0 22px 44px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08) inset; }
  .act .t { font-weight: 800; font-size: 30px; letter-spacing: .18em; }
  .act .ph { font-weight: 700; font-size: 30px; letter-spacing: .02em; background: var(--cream); color: var(--brand);
    padding: 16px 26px; border-radius: 100px; white-space: nowrap; }
</style>
</head>
<body>
<div class="post">
  <div class="key"></div><div class="fill"></div>
  <svg class="grain" width="1080" height="1350" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="head">
    <!-- STAND-IN: replace with the official Success4Sure logo file -->
    <div class="logo"><span class="w1">SUCCESS</span><span class="w2">4 SURE</span></div>
    <div class="k">KHALDA</div>
  </div>

  <div class="title">
    <div class="h1">Digital <span>SAT</span></div>
    <div class="h2">Meet your teachers.</div>
  </div>

  <div class="dates">
    <div class="chip main"><span class="l">COURSE STARTS</span><span class="v">11 OCTOBER</span></div>
    <div class="chip"><span class="l">TEST DAY</span><span class="v">7 NOVEMBER</span></div>
  </div>

  <div class="teachers">
    <div class="card sara">
      <img src="assets/sara_cutout.png" alt="">
      <div class="shade"></div>
      <div class="name"><span class="subj">ENGLISH</span><div class="n">Ms. Sara Abd El Raheem</div></div>
    </div>
    <div class="card naseem">
      <img src="assets/naseem_cutout.png" alt="">
      <div class="shade"></div>
      <div class="name"><span class="subj">MATH</span><div class="n">Mr. Naseem Al Labadi</div></div>
    </div>
  </div>

  <div class="act">
    <span class="t">REGISTER NOW</span>
    <span class="ph">+962 79 055 5890</span>
  </div>
</div>
</body>
</html>
