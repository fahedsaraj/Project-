<!doctype html>
<!-- Motion-graphics overlay for the EST Economics teacher reel (transparent; 1080x1920, 14.8 s).
     Render: node .claude/skills/uia-video-studio/scripts/render_frames.js est_econ_reel_overlay.html overlay.mov --dur 14.8 --alpha
     Then composite with est_econ_reel.sh. Caption timings come from the speech pauses of the source clip. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'A';font-weight:600;src:url('file://{{BRAND}}/Fonts/static/Archivo-SemiBold.ttf')}
@font-face{font-family:'AW';font-weight:600;src:url('file://{{BRAND}}/Fonts/static/Archivo-SemiBoldExpanded.ttf')}
@font-face{font-family:'N';font-style:italic;src:url('file://{{BRAND}}/Fonts/Newsreader-italic-400-latin.woff2')}
@font-face{font-family:'AR';font-weight:700;src:url('file://{{BRAND}}/Fonts/IBMPlexSansArabic-normal-700-arabic.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;color:#fff;font-family:'A',sans-serif}
.ar{font-family:'AR','A';font-weight:700}
.cap{position:absolute;left:60px;right:60px;top:1270px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;direction:rtl;opacity:0}
.w{display:inline-block;font-size:80px;line-height:1.3;opacity:0;text-shadow:0 6px 0 rgba(11,22,38,.55),0 0 30px rgba(11,22,38,.6);-webkit-text-stroke:2px rgba(11,22,38,.35)}
.w.g{color:#E2A02D}
.w.box{background:#E2A02D;color:#0B1626;text-shadow:none;-webkit-text-stroke:0;border-radius:18px;padding:0 22px}
.tag{position:absolute;left:56px;top:270px;display:flex;align-items:center;gap:14px;background:rgba(11,22,38,.82);border:2px solid rgba(226,160,45,.8);border-radius:999px;padding:12px 26px 12px 18px;opacity:0}
.tag i{width:14px;height:14px;border-radius:50%;background:#E2A02D}
.tag b{font-family:'AW';font-weight:600;font-size:24px;letter-spacing:.18em}
.badge{position:absolute;left:0;right:0;top:1010px;text-align:center;opacity:0}
.badge .est{display:inline-block;background:#0B1626;border:6px solid #E2A02D;border-radius:30px;padding:4px 40px;font-family:'AW';font-weight:600;font-size:96px;letter-spacing:.06em}
.badge .eco{display:block;margin-top:14px;font-family:'AW';font-weight:600;font-size:46px;letter-spacing:.32em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.uia{position:absolute;left:0;right:0;top:960px;text-align:center;opacity:0}
.uia .p{display:inline-flex;align-items:center;gap:22px;background:rgba(11,22,38,.88);border-radius:28px;padding:22px 36px}
.uia .p div:last-child{font-family:'AW';font-weight:600;font-size:34px;letter-spacing:.12em;text-align:left;line-height:1.25}
.wipe{position:absolute;top:-400px;bottom:-400px;width:260px;background:#E2A02D;transform:skewX(-14deg);left:-900px}
.line{position:absolute;top:-400px;bottom:-400px;width:10px;background:#E2A02D;transform:skewX(-14deg);left:-900px}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.bar{position:absolute;left:0;top:0;height:8px;background:#E2A02D}
.corner{position:absolute;width:70px;height:70px;border:6px solid #E2A02D;opacity:0}
.strike{position:absolute;height:10px;background:#E2A02D;border-radius:5px;transform-origin:right center}
#end{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 45%,#1c3b52 0%,#0B1626 70%);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:250px 90px 340px;text-align:center}
#end .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(216,218,223,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(216,218,223,.05) 2px,transparent 2px);background-size:90px 90px}
.lbl{font-family:'AW';font-weight:600;letter-spacing:.2em;font-size:28px;color:#D8DADF}
</style></head><body>
<div class="bar" id="bar"></div>
<div class="corner" id="k1" style="left:40px;top:250px;border-right:0;border-bottom:0"></div>
<div class="corner" id="k2" style="right:40px;top:250px;border-left:0;border-bottom:0"></div>
<div class="tag" id="tag"><i></i><b>EST · ECONOMICS</b></div>
<div class="badge" id="badge"><span class="est">EST</span><span class="eco">ECONOMICS</span></div>
<div class="uia" id="uia"><div class="p"><div style="width:110px">{{SYMBOL}}</div><div>UNITED<br>INTERNATIONAL<br>ACADEMY</div></div></div>

<div class="cap" id="c0"><span class="w">متغلّب</span><span class="w">بالـ</span><span class="w g" dir="ltr" style="font-family:'A'">EST Economics</span></div>
<div class="cap" id="c1"><span class="w">مادة</span><span class="w g">سهلة</span><span class="w">…</span><span class="w">بس</span><span class="w">مش</span><span class="w">عارف</span><span class="w">من</span><span class="w">وين</span><span class="w">تبلّش؟</span></div>
<div class="cap" id="c3"><span class="w">بعطيك</span><span class="w box">الحل</span><span class="w">بأسهل</span><span class="w">طريقة</span></div>
<div class="cap" id="c4"><span class="w">هاد</span><span class="w">مش</span><span class="w">مجرد</span><span class="w" id="exam">امتحان</span></div>
<div class="cap" id="c5"><span class="w">هاد</span><span class="w box">استثمار</span><span class="w g">بنفسك</span></div>
<div class="cap" id="c6"><span class="w g">سجّل</span><span class="w">معنا</span><span class="w">عشان</span><span class="w">نقدر</span><span class="w">نوصلك</span></div>
<div class="strike" id="strike"></div>

<div id="end"><div class="grid"></div>
  <div id="e1" style="width:560px;position:relative">{{LOGO_STACKED}}</div>
  <div id="e2" style="margin-top:56px;position:relative"><span style="display:inline-block;border:5px solid #E2A02D;border-radius:24px;padding:4px 30px;font-family:'AW';font-weight:600;font-size:64px;letter-spacing:.06em">EST</span>
    <span style="font-family:'AW';font-weight:600;font-size:40px;letter-spacing:.24em;margin-left:18px">ECONOMICS</span></div>
  <div class="ar" id="e3" style="font-size:110px;margin-top:40px;position:relative">سجّل الآن</div>
  <div id="e4" style="margin-top:36px;border:4px solid #E2A02D;border-radius:36px;padding:24px 50px;position:relative">
    <div class="lbl">CALL OR WHATSAPP</div><div style="font-weight:600;font-size:80px;margin-top:8px">+962 79 055 5890</div></div>
</div>
<div class="line" id="l1"></div><div class="wipe" id="w"></div><div class="line" id="l2"></div><div class="flash" id="fl"></div>
<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)), eo=x=>1-Math.pow(1-cl(x),3);
const bk=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(el,t,a,dur=.3,from=1.6)=>{const k=cl((t-a)/dur);el.style.opacity=k>0?1:0;el.style.transform='scale('+(from+(1-from)*bk(k))+')';};
// [caption id, speech start, speech end] from silencedetect on the source
const CAPS=[['c0',.12,1.72],['c1',1.88,3.6],['c3',5.49,6.48],['c4',7.0,8.08],['c5',8.31,9.42],['c6',9.73,11.1]];
const WIPES=[6.93,11.3];           // shot change, end card
const FLASH=[6.93,11.3];
window.setT=(t)=>{
  $('bar').style.width=(1080*cl(t/11.3))+'px';$('bar').style.opacity=t<11.3?1:0;
  // captions: words pop one by one across the spoken span
  for(const [id,a,z] of CAPS){const c=$(id),ws=[...c.querySelectorAll('.w')],on=t>=a-.08&&t<z+.25;c.style.opacity=on?1:0;
    if(!on)continue;const step=Math.min(.22,(z-a)*.8/ws.length);ws.forEach((w,i)=>pop(w,t,a-.08+i*step,.22,1.7));}
  // 'امتحان' struck through, then replaced by 'استثمار'
  const ex=$('exam'),sk=$('strike');if(t>=7.6&&t<8.33){const r=ex.getBoundingClientRect();sk.style.left=(r.left-8)+'px';sk.style.width=(r.width+16)+'px';
    sk.style.top=(r.top+r.height*.55)+'px';sk.style.transform='scaleX('+eo((t-7.6)/.2)+')';sk.style.opacity=1;}else sk.style.opacity=0;
  // hook badge + tag
  const bdg=$('badge');if(t>=.75&&t<1.8){pop(bdg,t,.75,.35,2.2);}else bdg.style.opacity=0;
  const tg=$('tag');const tk=eo((t-1.8)/.4);tg.style.opacity=(t>=1.8&&t<11.25)?tk:0;tg.style.transform='translateX('+(-(1-tk)*60)+'px)';
  // UIA name card (speech 3.87-5.15)
  const u=$('uia');if(t>=3.8&&t<5.35){pop(u,t,3.8,.35,1.8);}else u.style.opacity=0;
  // corner brackets frame the speaker on the punch-ins
  const kk=(t>=.1&&t<.6)||(t>=5.45&&t<5.95)||(t>=8.3&&t<8.8)?1:0;['k1','k2'].forEach(k=>{$(k).style.opacity=kk});
  // gold wipes + flash
  let wk=-1;for(const c of WIPES){const d=t-(c-.22);if(d>=0&&d<.45)wk=d/.45;}
  const X=wk<0?-900:-700+wk*2500;$('w').style.left=X+'px';$('l1').style.left=(X-120)+'px';$('l2').style.left=(X+380)+'px';
  let f=0;for(const s of FLASH){const d=t-s;if(d>=0&&d<.25)f=Math.max(f,(1-d/.25)*.25);}$('fl').style.opacity=f;
  // end card
  $('end').style.opacity=t>=11.3?1:0;
  pop($('e1'),t,11.4,.5,.6);pop($('e2'),t,12.0,.3,1.8);pop($('e3'),t,12.4,.3,1.9);pop($('e4'),t,12.9,.35,1.3);
};
setT(0);
</script></body></html>
